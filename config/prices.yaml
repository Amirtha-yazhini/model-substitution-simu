# Published paid-tier prices, USD per million tokens.
#
# We never spend money - the census runs entirely on free tiers. These rates exist
# so the ledger can IMPUTE what each request would have cost on a paid plan, which
# is all the audit-economics analysis needs (idea.md C3a): the break-even dilution
# rate eps* is a function of price ratios and query counts, not of actual spend.
#
# Rates are indicative public list prices as of 2026-09; they move, and exact
# values matter less than the RATIO between a genuine model and its substitute,
# which is what sets the adversary's savings per diluted request.

endpoints:

