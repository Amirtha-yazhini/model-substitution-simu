# Model roster: the substitution ladders SHIM simulates.
#
# REBUILT 2026-09-08 from live /models listings. The first draft guessed slugs
# from memory and every one 404'd - Llama 3.3 is gone from Groq, Cerebras now
# requires payment (HTTP 402), and Google's slugs carry a `models/` prefix.
# This is why slugs are discovered, never assumed.
#
# scripts/01_limits.py verifies these and writes config/models.resolved.yaml.
# Downstream code reads the RESOLVED file, not this one.

ladders:

  gptoss_primary:
    description: >
      Primary ladder: 120B -> 20B within one family on one provider. A ~6x
      parameter drop is exactly the economically-motivated swap a cost-cutting
      gateway would make, and keeping it on a single provider isolates model
      identity from infrastructure differences.
      NOTE: both rungs are REASONING models - they spend 14-40 tokens thinking
      before answering, so probes need max_tokens ~256, not Bruckner's 16.
    genuine:
      candidates:
        - {provider: groq, slug: "openai/gpt-oss-120b"}
    substitute:
      candidates:
        - {provider: groq, slug: "openai/gpt-oss-20b"}
    reference:
      strategy: cross_provider_consensus

  qwen_hard:
    description: >
      The HARD case: same parameter count, adjacent versions. Detecting this is
      the low-margin regime where IRIS predicts Theta(1/eps^2) query complexity.
      If an auditor separates 3.8 from 3.6 it is reading something real; if it
      cannot, that is an honest limit worth reporting.
    genuine:
      candidates:
        - {provider: groq, slug: "qwen/qwen3.8-27b"}
    substitute:
      candidates:
        - {provider: groq, slug: "qwen/qwen3.6-27b"}
    reference:
      strategy: cross_provider_consensus

  mistral_clean:
    description: >
      The clean case: a genuine FIRST-PARTY reference (Mistral's own API), so
      ground truth is real rather than consensus. Four rungs available, giving a
      graded difficulty series. Rate-limited to 2 RPM, so schedule early and let
      it run long.
    genuine:
      candidates:
        - {provider: mistral, slug: mistral-medium-latest}
    substitute:
      candidates:
        - {provider: mistral, slug: mistral-small-latest}
        - {provider: mistral, slug: ministral-8b-latest}
        - {provider: mistral, slug: ministral-3b-latest}
    reference:
      strategy: first_party
      provider: mistral

  nemotron_ladder:
    description: >
      Three-rung ladder on OpenRouter free: 550B -> 120B -> 30B. The widest
      capability gap available, so it should be the EASIEST arm to detect - the
      upper bound on auditor performance. Costly in quota (50 RPD account-wide),
      so use sparingly.
    genuine:
      candidates:
        - {provider: openrouter, slug: "nvidia/nemotron-3-ultra-550b-a55b:free"}
    substitute:
      candidates:
        - {provider: openrouter, slug: "nvidia/nemotron-3-super-120b-a12b:free"}
        - {provider: openrouter, slug: "nvidia/nemotron-3-nano-omni-30b-a3b-reasoning:free"}
    reference:
      strategy: cross_provider_consensus

  cross_provider:
    description: >
      NOT a size ladder - the same nominal model on DIFFERENT providers. This is
      the substrate for A2 (quantization swap) and A11 (benign quality routing),
      and for the free-tier study in idea.md section 6. Differences here are real
      ecosystem evidence, not simulation.
    same_model_across:
      - {provider: openrouter, slug: "google/gemma-4-31b-it:free"}
      - {provider: google, slug: "gemma-4-31b-it"}
    reference:
      strategy: first_party
      provider: google

# Probed by scripts/01_limits.py. Anything that answers is a candidate for
# promotion into a ladder above.
